<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeCuadra</title>
    <link rel="icon" type="image/png" href="./assets/imagenes/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="./assets/imagenes/logo-menu.png" alt="TeCuadra" class="brand-logo" />
        </div>
        <nav id="desktopNav" class="nav"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Panel offline</p>
            <h1 id="viewTitle">Dashboard</h1>
          </div>
          <div class="period-controls">
            <label class="period-chip">
              <svg class="period-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
              <span class="period-label">Año</span>
              <select id="yearSelect" aria-label="Año"></select>
            </label>
            <label class="period-chip">
              <svg class="period-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg>
              <span class="period-label">Mes</span>
              <select id="monthSelect" aria-label="Mes"></select>
            </label>
          </div>
        </header>
        <section id="view" class="view" aria-live="polite"></section>
      </main>

      <nav id="mobileNav" class="mobile-nav"></nav>
    </div>

    <template id="emptyState">
      <div class="empty">
        <strong>No hay datos para mostrar.</strong>
        <span>Registra informacion o carga un respaldo.</span>
      </div>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
